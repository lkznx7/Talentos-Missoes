name: talentos-missoes-dev
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-talentos_missoes}
      POSTGRES_USER: ${POSTGRES_USER:-tm_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tm_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tm_dev} -d ${POSTGRES_DB:-talentos_missoes}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
