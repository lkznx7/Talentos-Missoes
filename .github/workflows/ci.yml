name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
  java:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - api-gateway
          - services/talentos-service
          - services/empresas-missoes-service
          - services/candidaturas-service
          - services/notificacoes-service
          - services/indicadores-service
          - services/comunicacao-service
          - services/identidade-service
          - services/integracoes-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress verify
        working-directory: ${{ matrix.project }}
